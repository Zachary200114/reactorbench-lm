[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reactorbench-lm"
version = "0.1.0"
description = "A small Transformer trained from scratch on fictional Aster Station event sequences."
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy>=2.2,<3",
  "pydantic>=2.10,<3",
  "safetensors>=0.8.0",
  "sentencepiece>=0.2.2",
  "torch>=2.13.0",
]

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "hypothesis>=6.122,<7",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]
[tool.hatch.build.targets.sdist]
include = [
  "/configs",
  "/docs/model/PHASE6_REMEDIATION_RUNBOOK.md",
  "/docs/model/PHASE6_V02_INVENTORY.json",
  "/docs/model/PHASE6_V03_COUNTERFACTUAL_CAP.json",
  "/golden",
  "/schemas",
  "/scripts/check_phase6_status.sh",
  "/scripts/open_phase6_progress_gui.sh",
  "/scripts/phase6_monitor_controller.sh",
  "/scripts/replay_phase6_targeted03_gate.sh",
  "/scripts/resume_phase6_pipeline.sh",
  "/scripts/run_phase6_evaluation.sh",
  "/scripts/run_phase6_pipeline.sh",
  "/scripts/stop_phase6_pipeline.sh",
  "/src",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reactorbench"]

[tool.hatch.build.targets.wheel.force-include]
"configs/default.toml" = "reactorbench/_data/configs/default.toml"
"configs/model/phase4-smoke-v0.1.0.toml" = "reactorbench/_data/configs/model/phase4-smoke-v0.1.0.toml"
