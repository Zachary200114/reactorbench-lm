"scripts/run_phase6_evaluation.sh" = "reactorbench/_data/scripts/run_phase6_evaluation.sh"
"scripts/run_phase6_pipeline.sh" = "reactorbench/_data/scripts/run_phase6_pipeline.sh"
"scripts/stop_phase6_pipeline.sh" = "reactorbench/_data/scripts/stop_phase6_pipeline.sh"

[tool.pytest.ini_options]
minversion = "8.3"
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["reactorbench"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["artifacts", "checkpoints", "data/generated", "runs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["B", "C4", "DTZ", "E", "F", "I", "PIE", "PT", "RUF", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "tests"]
