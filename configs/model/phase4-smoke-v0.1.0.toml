[phase4]
config_version = "0.1.0"
dataset_root = "data/generated"
dataset_artifact_name = "phase3-development-v0.1.0-candidate"
postrender_approval_record = "artifacts/review/postrender-review-record-v0.1.0.json"
run_root = "runs"
run_name = "phase4-smoke-v0.1.0"

[tokenizer]
tokenizer_version = "0.1.0"
algorithm = "sentencepiece_bpe"
vocab_size = 2048
character_coverage = 1.0
byte_fallback = true
normalization_rule = "identity"
special_symbols = ["<|prompt|>", "<|target|>", "<|sep|>"]

[smoke_model]
model_version = "0.1.0"
layers = 2
width = 128
heads = 4
context_length = 128
feed_forward_multiplier = 4
dropout = 0.0
tie_embeddings = true
bias = true

[pilot_model]
model_version = "0.1.0"
layers = 6
width = 256
heads = 8
context_length = 256
feed_forward_multiplier = 4
dropout = 0.1
tie_embeddings = true
bias = true

[main_model]
model_version = "0.1.0"
layers = 8
width = 384
heads = 8
context_length = 512
feed_forward_multiplier = 4
dropout = 0.1
tie_embeddings = true
bias = true

[smoke_training]
seed = 4404
device = "cpu"
document_count = 4
batch_size = 4
steps = 300
learning_rate = 0.003
weight_decay = 0.0
gradient_clip_norm = 1.0
maximum_final_loss = 0.75
minimum_loss_reduction_fraction = 0.80
